name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Eval-only: instantiates every example format's derivation without
      # building a disk image. The real build lives in `packages.build-vm` and is
      # not run here.
      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: Formatting is clean
        run: |
          nix fmt
          git diff --exit-code

      # The template is the first thing a new user runs, and nothing else
      # exercises it. Initialise it in a scratch directory against this checkout.
      - name: Template evaluates
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          cd "$scratch"
          nix flake init -t "$GITHUB_WORKSPACE"
          git init -q . && git add -A
          # `nix flake lock` refuses to write a lock with a path input, so
          # override at eval time instead of locking first.
          nix eval --raw --override-input vm-parts "$GITHUB_WORKSPACE" .#myMachine.vm.drvPath
